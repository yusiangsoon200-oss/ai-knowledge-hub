<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin login | AI Knowledge Hub</title>
<style>
:root{--navy:#0b1730;--blue:#3978f6;--muted:#687891;--line:#e2e9f2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#dbeafe,transparent 35%),linear-gradient(135deg,#f5f8fc,#eaf1fa);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17243b}.panel{width:min(100%,430px);background:white;border:1px solid var(--line);border-radius:22px;padding:36px;box-shadow:0 24px 70px #17365b18}.mark{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#4c8cff,#53d8d0);font-size:24px;color:#07162e}h1{font-size:25px;margin:22px 0 6px}.sub{margin:0 0 26px;color:var(--muted);font-size:14px}label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3978f61a}button{width:100%;margin-top:22px;border:0;border-radius:10px;padding:13px;background:var(--blue);color:white;font-weight:800;font:inherit;cursor:pointer}button:disabled{opacity:.65;cursor:wait}#message{min-height:22px;margin:14px 0 0;font-size:13px;color:#b42318}.foot{margin-top:24px;color:#8491a5;font-size:11px;text-align:center}
</style></head><body><main class="panel"><div class="mark">✳</div><h1>Welcome back</h1><p class="sub">Sign in to manage your AI Knowledge Hub content.</p>
<form id="loginForm"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Sign in</button><p id="message" role="alert"></p></form><div class="foot">AI KNOWLEDGE HUB · ADMIN PORTAL</div></main>
<script>
const form=document.getElementById("loginForm"),button=document.getElementById("submit"),message=document.getElementById("message");
fetch("/api/auth/get-session",{credentials:"same-origin"}).then(r=>r.ok?r.json():null).then(s=>{if(s?.user)location.replace("/admin/dashboard.html")}).catch(()=>{});
form.addEventListener("submit",async e=>{e.preventDefault();button.disabled=true;button.textContent="Signing in…";message.textContent="";
try{const response=await fetch("/api/auth/sign-in/email",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({email:form.email.value,password:form.password.value})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||data.error||"Unable to sign in. Check your details.");location.replace("/admin/dashboard.html");}
catch(err){message.textContent=err.message||"Login failed.";}finally{button.disabled=false;button.textContent="Sign in";}});
</script></body></html>
